name: encounter-import-batch

# Drives the Encounter brand-import queue to completion. Three parallel jobs
# each loop the deployed /brands/queue/run endpoint; FOR UPDATE SKIP LOCKED in
# the endpoint keeps them from grabbing the same brand. Trigger manually.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Curl iterations per worker"
        default: "160"

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        worker: [1, 2, 3]
    steps:
      - name: Drive queue (worker ${{ matrix.worker }})
        env:
          BASE: "https://encounter-object-id.vercel.app"
          ITER: ${{ github.event.inputs.iterations }}
        run: |
          for i in $(seq 1 "${ITER:-160}"); do
            code=$(curl -s --max-time 75 -o /dev/null -w "%{http_code}" "$BASE/brands/queue/run?budget_seconds=55&max_pages=10" || echo "000")
            echo "worker ${{ matrix.worker }} iter $i -> $code"
          done
