name: encounter-import-batch

# Drives the Encounter brand-import queue to completion. Runs on GitHub's
# runners (open internet), hammering the deployed /brands/queue/run endpoint
# with a few parallel workers until the queue is empty. Trigger manually.
on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel workers"
        default: "3"
      base_url:
        description: "Deployed app base URL"
        default: "https://encounter-object-id.vercel.app"

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Drive the import queue
        env:
          BASE: ${{ github.event.inputs.base_url }}
          WORKERS: ${{ github.event.inputs.workers }}
        run: |
          set -u
          worker() {
            for i in $(seq 1 600); do
              curl -s --max-time 75 "$BASE/brands/queue/run?budget_seconds=55&max_pages=10" -o /dev/null || true
            done
          }
          for w in $(seq 1 "${WORKERS:-3}"); do worker & done

          for t in $(seq 1 400); do
            sleep 20
            s=$(curl -s --max-time 30 "$BASE/brands/queue" || echo '{}')
            pend=$(printf '%s' "$s" | python3 -c "import sys,json;d=json.load(sys.stdin);c=d.get('counts',{});print(c.get('pending',0)+c.get('running',0))" 2>/dev/null || echo 1)
            prod=$(printf '%s' "$s" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('total_products_imported',0))" 2>/dev/null || echo 0)
            echo "[tick $t] pending+running=$pend  total_products=$prod"
            if [ "$pend" = "0" ]; then echo "QUEUE DRAINED"; break; fi
          done
          curl -s "$BASE/brands/queue" | python3 -c "import sys,json;d=json.load(sys.stdin);print('FINAL counts:',d.get('counts'));print('total products:',d.get('total_products_imported'))" || true
